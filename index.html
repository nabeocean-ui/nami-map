<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surf Wave Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen world map (OpenStreetMap tiles) with a floating control panel on top and a size legend at the bottom; tap a marker or any spot on the map for the forecast sheet. */
:root{
  --bg:#EDF3F3; --surface:#FFFFFF; --ink:#12262E; --muted:#566C74; --line:#D2DEE0;
  --accent:#0B6E8A; --on-accent:#FFFFFF;
  --w-on:#C2412D; --w-side:#B7791F; --w-off:#0E8A6B; --w-calm:#7A8F96;
  --l0:#BFCDD1; --l1:#8DC6D6; --l2:#5CB1C9; --l3:#2F9BB9; --l4:#1D80A8; --l5:#1C5F9B; --l6:#2B3F8E; --l7:#52297C;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1A20; --surface:#14262E; --ink:#E6F0F1; --muted:#93AAB2; --line:#26404A;
    --accent:#5CC3DE; --on-accent:#08222B;
    --w-on:#F08A74; --w-side:#E3B25D; --w-off:#4FD1A8; --w-calm:#8AA0A7;
    --l0:#3C525A; --l1:#2D7E93; --l2:#3496B2; --l3:#3DAACB; --l4:#4C94D1; --l5:#6C86DC; --l6:#8C7FE0; --l7:#B27AD8;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* map */
#map{position:fixed;inset:0;overflow:hidden;background:var(--bg);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
.tiles{position:absolute;inset:0}
.tiles img{position:absolute;display:block;max-width:none;-webkit-user-drag:none;pointer-events:none}
@media (prefers-color-scheme:dark){.tiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.8)}}
.mks{position:absolute;inset:0;pointer-events:none}
.sp,.pin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;will-change:transform}
.attr{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:max(4px,env(safe-area-inset-bottom,0px));z-index:900;font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:1px 6px;border-radius:6px}
.attr a{color:inherit}
.zoom{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(148px + env(safe-area-inset-bottom,0px));z-index:900;display:grid;gap:6px}
.zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.zoom svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;fill:none}

/* top panel */
.top{position:fixed;z-index:1000;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));pointer-events:none}
.panel{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:6px;display:grid;gap:6px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.r1{display:flex;gap:6px;align-items:center}
.r1 .sp-grow{flex:1}
.brand{width:30px;height:30px;flex:none}
.stamp{font:600 14px var(--f-num);color:var(--muted);letter-spacing:.03em;min-width:36px;text-align:center}
.chip{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:3px 6px;cursor:pointer;display:grid;place-items:center;line-height:1.15}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.times{display:grid;grid-template-columns:repeat(3,42px);gap:5px}
.times .chip svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.regions{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px}
.regions::-webkit-scrollbar{display:none}
.regions .chip{flex:none;min-height:34px;font-weight:700;font-size:13px;padding:2px 11px;white-space:nowrap}
.langbtn{min-width:44px;height:40px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 14px var(--f-num);cursor:pointer;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.days .chip .d{font:700 17px var(--f-num);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.days .chip .w{font-size:11px;opacity:.85}
.days .chip .w.sat{color:#2A74C7}.days .chip .w.sun{color:#C2412D}
.days .chip[aria-pressed="true"] .w{color:inherit}
.days .today{display:block;width:5px;height:5px;border-radius:50%;background:currentColor;margin:0 auto}
@media (max-width:440px){.brand{display:none}}

/* legend */
.legend{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100vw - 20px));background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:14px;padding:6px 6px 4px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.legend .scale{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.legend .scale div{display:grid;justify-items:center}
.legend .pic{width:100%;max-width:42px}
.legend small{font:600 12px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.legend .tip{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11px;margin-top:2px}
.legend .tip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.legend{padding-bottom:6px}
.legend .tip{position:relative;min-height:30px}
#iconsw{position:absolute;right:0;bottom:-2px;width:36px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
#iconsw svg{width:22px;height:22px;stroke:var(--ink)}

/* status */
#status{pointer-events:none;padding-top:6px}
.status{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--w-on);border-radius:12px;background:var(--surface)}
.status p{margin:0;flex:1 1 200px;font-size:13px}
.status button{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer}

/* pictograms */
.pic{display:block;width:100%;height:auto;aspect-ratio:1}
.person{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.person circle{fill:var(--ink);stroke:none}
.board{fill:var(--ink);opacity:.72}
.board-line{fill:none;stroke:var(--surface);stroke-width:.9;stroke-linecap:round;opacity:.8}
.rider{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rider circle{fill:var(--ink);stroke:none}
.rboard{fill:var(--ink)}
.spray{fill:var(--wc);opacity:.6}
.lip{fill:none;stroke:var(--wc);stroke-width:2.8;stroke-linecap:round}
.water{fill:var(--wc);opacity:.9}
.crest{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:1.2;stroke-linecap:round}
.lv0{--wc:var(--l0)}.lv1{--wc:var(--l1)}.lv2{--wc:var(--l2)}.lv3{--wc:var(--l3)}
.lv4{--wc:var(--l4)}.lv5{--wc:var(--l5)}.lv6{--wc:var(--l6)}.lv7{--wc:var(--l7)}.lvx{--wc:var(--w-calm)}

/* markers */
.dot{display:block;width:16px;height:16px;border-radius:50%;background:var(--wc);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.pill{display:flex;align-items:center;gap:1px;height:30px;padding:0 9px 0 2px;background:var(--surface);border:2px solid var(--wc);border-radius:16px;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.pill svg{width:26px;height:26px;flex:none}
.pill b{font:700 15px var(--f-num);font-variant-numeric:tabular-nums}
.big{display:grid;justify-items:center;width:78px;padding:2px 3px 3px;background:var(--surface);border:2px solid var(--wc);border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.3)}
.big svg,.big .blank{width:50px;height:50px}
.big .blank{border-radius:8px;background:repeating-linear-gradient(135deg,var(--line) 0 5px,transparent 5px 10px)}
.big b{font:700 17px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.big b small{font-size:12px;color:var(--muted);margin-left:1px}
.big i{font:700 11px/1.3 var(--f-body);font-style:normal;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big em{font:400 10px/1.25 var(--f-body);font-style:normal;color:var(--muted);max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinicon{width:28px;height:36px;fill:var(--accent);stroke:#fff;stroke-width:1.6}

/* mini glyphs */
.mini{display:inline-flex;align-items:center;gap:3px;font:600 14px var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.mini svg{width:20px;height:20px;flex:none}
.mini .u{font-size:11px;color:var(--muted)}
.mini .stroke{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ring{fill:none;stroke:var(--line);stroke-width:1.4}
.w-on{--wc2:var(--w-on)}.w-side{--wc2:var(--w-side)}.w-off{--wc2:var(--w-off)}.w-calm{--wc2:var(--w-calm)}
.warrow{fill:none;stroke:var(--wc2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mk{width:9px!important;height:9px!important;fill:var(--wc2);stroke:var(--wc2)}
.mk.hollow{fill:none;stroke-width:1.6}

/* detail sheet */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
dialog::backdrop{background:rgba(5,14,18,.55)}
.dh{display:flex;align-items:center;gap:8px;padding:14px 14px 6px 16px}
.dh b{font-size:17px;flex:1;min-width:0}
.dh small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.dbody{padding:4px 16px 16px;display:grid;gap:16px}
.sum{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.ht{display:flex;align-items:baseline;gap:2px}
.ht b{font:700 56px/1 var(--f-num);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.ht small{font:600 14px var(--f-num);color:var(--muted)}
.sum .meta{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:6px}
.sum .mini{font-size:17px}.sum .mini svg{width:26px;height:26px}
.kvs{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.kv svg{width:22px;height:22px}
.kv .stroke{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kv b{font:700 20px var(--f-num);font-variant-numeric:tabular-nums}
.kv small,.kv em{font:600 13px var(--f-num);color:var(--muted);font-style:normal}
.kv em{margin-left:4px;padding-left:6px;border-left:1px solid var(--line)}
.tidenum{display:flex;justify-content:space-between;font:600 13px var(--f-num);color:var(--muted);margin-top:2px}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end}
.bar3{display:grid;justify-items:center;gap:2px;min-width:0}
.bar3 .v{font:600 13px var(--f-num);font-variant-numeric:tabular-nums}
.bar3 .col{display:flex;align-items:flex-end;width:100%;height:96px;border-bottom:1px solid var(--line)}
.bar3 .col i{display:block;width:100%;border-radius:5px 5px 0 0;background:var(--wc);min-height:2px}
.bar3 .x,.bar3 .p{font:600 12px var(--f-num);color:var(--muted)}
.cap{font-size:12px;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.days5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.days5 button{display:grid;justify-items:center;padding:6px 2px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;min-width:0}
.days5 button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.days5 .pic{width:100%;max-width:56px}
.days5 .d{font:700 14px var(--f-num)}
.days5 .m{font:600 13px var(--f-num);color:var(--muted)}
.loading{height:96px;border-radius:12px;background:repeating-linear-gradient(135deg,var(--line) 0 8px,transparent 8px 16px);opacity:.55}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:40px;display:inline-flex;align-items:center;font-size:13px}
.links a:hover{border-color:var(--accent)}
.note{margin:0;color:var(--muted);font-size:11.5px}
</style>
</head>

  </div>
  <div class="dbody" id="dbody"></div>
</dialog>

<script>

  const keep=new Set();
  for(let ty=Math.max(0,y0);ty<=Math.min(n-1,y1);ty++){
    for(let tx=x0;tx<=x1;tx++){
      const wx=((tx%n)+n)%n,key=zi+"/"+wx+"/"+ty+"@"+tx;
      let img=tileCache.get(key);
      if(!img){
        img=new Image();img.alt="";img.decoding="async";
        img.onerror=()=>{img.style.visibility="hidden"};
        img.src=TILE.replace("{z}",zi).replace("{x}",wx).replace("{y}",ty);
        tilesEl.appendChild(img);tileCache.set(key,img);
      }
      img.style.left=((tx*256-c.x)*scale+W/2).toFixed(1)+"px";
      img.style.top=((ty*256-c.y)*scale+H/2).toFixed(1)+"px";
      img.style.width=img.style.height=(256*scale+0.6).toFixed(1)+"px";
      keep.add(key);
    }
  }
  for(const [k,img] of tileCache){if(!keep.has(k)){img.remove();tileCache.delete(k)}}
}

/* ---- markers ---- */
const markers=SPOTS.map(s=>{
  const el=document.createElement("div");
  el.className="sp";el.dataset.i=s.i;el.setAttribute("role","button");el.tabIndex=0;
  mksEl.appendChild(el);
  return {s,el,mode:null,ax:0,ay:0};
});
let pinEl=null,pinLL=null;
const modeOf=z=>z<7?"dot":z<10?"pill":"big";
function spotState(i){
  const h=wave(i,"wave_height",state.day,SLOTS[state.slot].h);
  return h==null?null:{h,l:level(h)};
}
function setIcon(m,mode){
  const st=spotState(m.s.i),cls=st?"lv"+st.l:"lvx";
  m.mode=mode;
  if(mode==="dot"){m.el.innerHTML=`<span class="dot ${cls}"></span>`;m.ax=8;m.ay=8}
  else if(mode==="pill"){m.el.innerHTML=`<div class="pill ${cls}">${st?sizeSVG(st.l):""}<b>${st?st.h.toFixed(1):"—"}</b></div>`;m.ax=st?36:22;m.ay=15}
  else{const al=altsOf(m.s)[0];m.el.innerHTML=`<div class="big ${cls}">${st?sizeSVG(st.l):'<span class="blank"></span>'}<b>${st?st.h.toFixed(1):"—"}<small>m</small></b><i>${esc(nameOf(m.s))}</i>${al?`<em>${esc(al)}</em>`:""}</div>`;m.ax=39;m.ay=40}
  m.el.title=nameOf(m.s);
  m.el.setAttribute("aria-label",nameOf(m.s)+(st?" "+st.h.toFixed(1)+" m "+LVL(st.l):""));
}
function placeMarkers(){
  const mode=modeOf(view.z),WS=wsize(view.z);
  const wx=x=>x-Math.round((x-W/2)/WS)*WS;
  for(const m of markers){
    if(m.mode!==mode)setIcon(m,mode);
    const p=toScreen(m.s.lat,m.s.lon);p.x=wx(p.x);
    if(p.x<-90||p.x>W+90||p.y<-90||p.y>H+90){m.el.style.display="none";continue}
    m.el.style.display="";
    m.el.style.transform=`translate(${(p.x-m.ax).toFixed(1)}px,${(p.y-m.ay).toFixed(1)}px)`;
    m.el.style.zIndex=Math.round(p.y);
  }
  if(pinEl&&pinLL){
    const p=toScreen(pinLL.lat,pinLL.lon);p.x=wx(p.x);
    pinEl.style.transform=`translate(${(p.x-14).toFixed(1)}px,${(p.y-34).toFixed(1)}px)`;
    pinEl.style.zIndex=9999;
  }
}
function refreshIcons(){markers.forEach(m=>{m.mode=null});placeMarkers()}
let raf=0;
function draw(){drawTiles();placeMarkers()}
function schedule(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
function setPin(ll){
  pinLL=ll;
  if(!pinEl){
    pinEl=document.createElement("div");pinEl.className="pin";
    pinEl.innerHTML='<svg class="pinicon" viewBox="0 0 28 36" aria-hidden="true"><path d="M14 34S3 22.5 3 13.5a11 11 0 0 1 22 0C25 22.5 14 34 14 34z"/><circle cx="14" cy="13.5" r="4" fill="#fff" stroke="none"/></svg>';
    mksEl.appendChild(pinEl);
  }
  placeMarkers();
}

/* ---- gestures ---- */
const ptrs=new Map();
let g0=null,z0=0,d0=0,start=null;
const pts=()=>[...ptrs.values()];
const midOf=p=>({x:p.reduce((a,b)=>a+b.x,0)/p.length,y:p.reduce((a,b)=>a+b.y,0)/p.length});
function rebase(){
  const p=pts();if(!p.length)return;
  const m=midOf(p);g0=geoAt(m.x,m.y);z0=view.z;
  d0=p.length>1?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0;
}
mapEl.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  try{mapEl.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)start={x:e.clientX,y:e.clientY,t:Date.now(),target:e.target,moved:false};
  else if(start)start.moved=true;
  rebase();
});
mapEl.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const p=pts(),m=midOf(p);
  if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>6)start.moved=true;
  if(!start||!start.moved)return;
  const nz=p.length>1&&d0>0?z0+Math.log2(Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)/d0):z0;
  anchor(g0,m.x,m.y,nz);schedule();
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){
    if(e.type==="pointerup"&&start&&!start.moved&&Date.now()-start.t<700)tap(start.target,e.clientX,e.clientY);
    start=null;
  }else rebase();
}
mapEl.addEventListener("pointerup",endPtr);
mapEl.addEventListener("pointercancel",endPtr);
mapEl.addEventListener("wheel",e=>{
  e.preventDefault();
  const g=geoAt(e.clientX,e.clientY);
  anchor(g,e.clientX,e.clientY,view.z-e.deltaY*(e.deltaMode===1?0.05:0.0022));schedule();
},{passive:false});
function tap(target,x,y){
  const spEl=target&&target.closest?target.closest(".sp"):null;
  if(spEl){pick(+spEl.dataset.i);return}
  const pinHit=target&&target.closest?target.closest(".pin"):null;
  if(pinHit&&CUSTOM){pick("c");return}
  pickCustom(geoAt(x,y));
}
mapEl.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("sp")){e.preventDefault();pick(+e.target.dataset.i)}
});
function zoomBy(d){const g=geoAt(W/2,H/2);anchor(g,W/2,H/2,Math.round(view.z)+d);draw()}
document.getElementById("zin").addEventListener("click",()=>zoomBy(1));
document.getElementById("zout").addEventListener("click",()=>zoomBy(-1));

/* ---- view presets ---- */
function usable(){
  const top=document.getElementById("panel").getBoundingClientRect().bottom;
  const bot=H-document.getElementById("legend").getBoundingClientRect().top;
  return{top,bot};
}
function fit(lat,lon,spanLat,spanLon){
  const u=usable();
  const zH=Math.log2((H-u.top-u.bot-16)*360*Math.cos(lat*Math.PI/180)/(256*spanLat));
  const zW=Math.log2((W-24)*360/(256*spanLon));
  anchor({lat,lon},W/2,(u.top+(H-u.bot))/2,Math.min(zH,zW));
  draw();
}
function fitRegion(id){const r=REGIONS.find(x=>x.id===id);if(r)fit(r.lat,r.lon,r.sa,r.so)}

/* ---- UI ---- */
function renderChips(){
  document.getElementById("days").innerHTML=DAYS.map((d,n)=>{
    const [y,m,dd]=d.split("-").map(Number);const wd=new Date(y,m-1,dd).getDay();
    return `<button class="chip" data-day="${n}" aria-pressed="${n===state.day}"><span class="d">${m}/${dd}</span><span class="w ${wd===6?"sat":wd===0?"sun":""}">${T[LANG].wd[wd]}</span>${n===0?'<span class="today"></span>':""}</button>`;
  }).join("");
  document.getElementById("times").innerHTML=SLOTS.map((s,n)=>`<button class="chip" data-slot="${n}" aria-pressed="${n===state.slot}" aria-label="${T[LANG].slot[n]} ${s.h}:00">${s.icon}</button>`).join("");
}
function renderRegions(){
  document.getElementById("regions").innerHTML=REGIONS.map(r=>`<button class="chip" data-reg="${r.id}">${r[LANG]}</button>`).join("");
}
function renderLegend(){
  const labels=["0m","0.2","0.4","0.7","1","1.4","2","3+"];
  document.getElementById("scale").innerHTML=T[LANG].lv.map((_,l)=>`<div>${sizeSVG(l)}<small>${labels[l]}</small></div>`).join("");
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.title=tr("title")+" / Surf Map";
  const al=(id,k)=>{const e=document.getElementById(id);if(e)e.setAttribute("aria-label",tr(k))};
  al("map","map");al("zin","zin");al("zout","zout");al("legend","legend");al("iconsw","iconsw");al("dclose","close");al("reload","reload");
  document.getElementById("tiptxt").textContent=tr("tip");
  const lb=document.getElementById("langbtn");lb.textContent=tr("other");lb.setAttribute("aria-label",tr("langbtn"));
  renderRegions();renderLegend();render();
  if(dlg.open)openDetail(state.open);
}
function render(){
  renderChips();
  document.getElementById("status").innerHTML=ERR?`<div class="status" role="alert"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--w-on)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18.5v.5"/></svg><p>${tr("err")}</p><button id="retry">${tr("retry")}</button></div>`:"";
  refreshIcons();
}

/* ---- detail sheet ---- */
const dlg=document.getElementById("dlg");
function metaHTML(key,date,hour,face){
  const per=wave(key,"wave_period",date,hour),dir=wave(key,"wave_direction",date,hour);
  const ws=wind(key,"wind_speed_10m",date,hour),wd=wind(key,"wind_direction_10m",date,hour);
  let s="";
  if(per!=null)s+=`<span class="mini" aria-label="${tr("per")} ${per.toFixed(0)} s">${periodSVG(per)}${per.toFixed(0)}<span class="u">s</span></span>`;
  if(dir!=null)s+=`<span class="mini" aria-label="${tr("wdir")}">${dirSVG((dir+180)%360)}</span>`;
  s+=windChip(ws,wd,face);
  return s;
}
function tideSVG(key,date,hour){
  const vals=Array.from({length:24},(_,h)=>tide(key,"sea_level_height_msl",date,h));
  if(vals.some(v=>v==null))return "";
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=Math.max(mx-mn,0.1);
  const X=h=>4+h/23*220,Y=v=>6+(1-(v-mn)/rg)*34;
  const line=vals.map((v,h)=>(h?"L":"M")+X(h).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  const ticks=[6,12,18].map(h=>`<path d="M${X(h).toFixed(1)} 42v4" style="fill:none;stroke:var(--muted);stroke-width:1.2"/>`).join("");
  const fmt=v=>(v>=0?"+":"−")+Math.abs(v).toFixed(1);
  return `<svg viewBox="0 0 228 48" style="width:100%;height:auto;display:block" role="img" aria-label="${tr("tide")} ${tr("max")} ${fmt(mx)} m ${tr("min")} ${fmt(mn)} m"><path d="${line} L${X(23)} 42 L${X(0)} 42 Z" style="fill:var(--l2);opacity:.28"/><path d="${line}" style="fill:none;stroke:var(--l4);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>${ticks}<path d="M4 42H224" style="stroke:var(--line);stroke-width:1;fill:none"/><circle cx="${X(hour).toFixed(1)}" cy="${Y(vals[hour]).toFixed(1)}" r="4" style="fill:var(--accent);stroke:var(--surface);stroke-width:2"/></svg><div class="tidenum"><span>▲ ${fmt(mx)}</span><span>▼ ${fmt(mn)}</span></div>`;
}
function openDetail(key){
  const s=spotOf(key);if(!s)return;
  state.open=key;
  const date=state.day,hour=SLOTS[state.slot].h;
  const nm=document.getElementById("dname");
  nm.textContent=nameOf(s);
  if(key==="c")nm.insertAdjacentHTML("beforeend",`<small>${fmtLL(s.lat,s.lon)}</small>`);
  else nm.insertAdjacentHTML("beforeend",`<small>${esc(altsOf(s).concat(subOf(s)).filter(Boolean).join(" · "))}</small>`);
  const h=wave(key,"wave_height",date,hour);
  let html="";
  if(h!=null){
    html+=`<div class="sum">${sizeSVG(level(h))}<div><div class="ht"><b>${h.toFixed(1)}</b><small>m</small></div><div class="meta">${metaHTML(key,date,hour,s.face)}</div></div></div>`;
    const sw=wave(key,"swell_wave_height",date,hour),sp=wave(key,"swell_wave_period",date,hour),ww=wave(key,"wind_wave_height",date,hour),temp=tide(key,"sea_surface_temperature",date,hour);
    const cells=[];
    if(sw!=null)cells.push(`<div class="kv" aria-label="${tr("swell")} ${sw.toFixed(1)} m"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="stroke" d="M1.5 12q4.2-9 8.5 0t8.5 0"/></svg><b>${sw.toFixed(1)}</b><small>m</small>${sp!=null?`<em>${sp.toFixed(0)}s</em>`:""}</div>`);
    if(ww!=null)cells.push(`<div class="kv" aria-label="${tr("windwave")} ${ww.toFixed(1)} m"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="stroke" d="M1.5 13l2.2-4 2.2 4 2.2-4 2.2 4 2.2-4 2.2 4 2.2-4"/></svg><b>${ww.toFixed(1)}</b><small>m</small></div>`);
    if(temp!=null)cells.push(`<div class="kv" aria-label="${tr("sst")} ${temp.toFixed(0)} °C"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="stroke" d="M8 3.5a2 2 0 0 1 4 0v8.2a3.6 3.6 0 1 1-4 0z"/><path class="stroke" d="M10 8v6"/></svg><b>${temp.toFixed(0)}</b><small>°C</small></div>`);
    if(cells.length)html+=`<div class="kvs">${cells.join("")}</div>`;
    const tsvg=tideSVG(key,date,hour);
    if(tsvg)html+=`<div><p class="cap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 9q2.5-3 5 0t5 0 5 0 5 0M2 16q2.5-3 5 0t5 0 5 0 5 0"/></svg>0 → 24h</p>${tsvg}</div>`;
    const hrs=[0,3,6,9,12,15,18,21],vals=hrs.map(x=>wave(key,"wave_height",date,x));
    const mx=Math.max(1.5,...vals.filter(v=>v!=null));
    html+=`<div><p class="cap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>3h</p><div class="bars">`+
      hrs.map((x,k)=>{
        const v=vals[k],p=wave(key,"wave_period",date,x);
        if(v==null)return `<div class="bar3"><span class="v">—</span><span class="col"></span><span class="x">${x}</span><span class="p">&nbsp;</span></div>`;
        return `<div class="bar3 lv${level(v)}"><span class="v">${v.toFixed(1)}</span><span class="col"><i style="height:${Math.max(2,v/mx*100).toFixed(0)}%"></i></span><span class="x">${x}</span><span class="p">${p==null?"":p.toFixed(0)+"s"}</span></div>`;
      }).join("")+`</div></div>`;
    html+=`<div><p class="cap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>${hour}:00 · ${tr("local")}</p><div class="days5">`+
      DAYS.map((d,n)=>{
        const v=wave(key,"wave_height",n,hour);const [,m,dd]=d.split("-").map(Number);
        return `<button data-pday="${n}" aria-pressed="${n===state.day}">${v==null?'<span class="pic"></span>':sizeSVG(level(v))}<span class="d">${m}/${dd}</span><span class="m">${v==null?"—":v.toFixed(1)}</span></button>`;
      }).join("")+`</div></div>`;
  }else if(DATA[key]&&DATA[key].full){
    html+=`<p class="note">${tr("noFc")}</p>`;
  }else{
    html+=`<div class="loading" aria-hidden="true"></div>`;
  }
  const lk=[["Windy",`https://www.windy.com/?${s.lat.toFixed(3)},${s.lon.toFixed(3)},9`]].concat((SITES[s.cc]||[]).map(x=>[x[LANG==="ja"?0:1],x[2]]),[["Surf-Forecast","https://www.surf-forecast.com/"]]);
  html+=`<div class="links">${lk.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join("")}</div><p class="note">${tr("note")}</p>`;
  document.getElementById("dbody").innerHTML=html;
  if(!dlg.open)dlg.showModal();
}
function pick(i){state.open=i;openDetail(i);loadDetail(i)}
function pickCustom(ll){
  CUSTOM={ja:"選んだ地点",en:"Selected point",loc:"",cc:"",pref:"",lat:ll.lat,lon:ll.lon,face:null,i:"c"};
  DATA.c={m:null,w:null,t:null,full:false};
  setPin(ll);
  pick("c");
}

/* ---- events ---- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-day],[data-slot],[data-pday],[data-reg],#retry,#reload,#dclose,#iconsw,#langbtn");
  if(!t){if(e.target===dlg)dlg.close();return}
  if(t.dataset.day!==undefined){state.day=+t.dataset.day;render();if(dlg.open)openDetail(state.open)}
  else if(t.dataset.slot!==undefined){state.slot=+t.dataset.slot;render();if(dlg.open)openDetail(state.open)}
  else if(t.dataset.pday!==undefined){state.day=+t.dataset.pday;render();openDetail(state.open)}
  else if(t.dataset.reg!==undefined)fitRegion(t.dataset.reg);
  else if(t.id==="langbtn"){
    LANG=LANG==="ja"?"en":"ja";
    try{localStorage.setItem("nami-lang",LANG)}catch(_){}
    applyLang();
  }
  else if(t.id==="iconsw"){
    ICON=ICON==="wave"?"body":"wave";
    try{localStorage.setItem("nami-icon",ICON)}catch(_){}
    renderLegend();refreshIcons();if(dlg.open)openDetail(state.open);
  }
  else if(t.id==="retry"||t.id==="reload")loadBulk(true);
  else if(t.id==="dclose")dlg.close();
});
dlg.addEventListener("close",()=>{state.open=null});
addEventListener("resize",()=>{W=innerWidth;H=innerHeight;draw()});

applyLang();
{const hs=decodeURIComponent(location.hash.slice(1));fitRegion(REGIONS.some(r=>r.id===hs)?hs:"iwate")}
loadBulk(false);
</script>
